# Example for a standalone Redis server on the same host as Zenoh.
bind 127.0.0.1
protected-mode yes
port 6379

# Use AOF persistence with an RDB-formatted base after an AOF rewrite.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes

# Prevent eviction of backend records; size this limit for the host.
maxmemory 2gb
maxmemory-policy noeviction
