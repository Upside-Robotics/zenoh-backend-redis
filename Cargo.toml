[package]
name = "zenoh-backend-redis"
version = "1.10.2"
edition = "2021"
license = "Apache-2.0"
description = "Standalone Redis storage backend for Eclipse Zenoh"
authors = ["Joseph Duchesne <joseph@upsiderobotics.com>"]
repository = "https://github.com/Upside-Robotics/zenoh-backend-redis"

[package.metadata.deb]
maintainer = "Joseph Duchesne <joseph@upsiderobotics.com>"
copyright = "2026 Upside Robotics"
section = "net"
license-file = ["LICENSE", "0"]
depends = "$auto, zenoh-plugin-storage-manager (= 1.10.2)"
assets = [
    ["target/release/libzenoh_backend_redis.so", "usr/lib/libzenoh_backend_redis.so", "644"],
    ["README.md", "usr/share/doc/zenoh-backend-redis/README.md", "644"],
    ["NOTICE", "usr/share/doc/zenoh-backend-redis/NOTICE", "644"],
    ["config/zenoh-redis.json5", "usr/share/doc/zenoh-backend-redis/examples/zenoh-redis.json5", "644"],
    ["config/redis.conf", "usr/share/doc/zenoh-backend-redis/examples/redis.conf", "644"],
]

[lib]
name = "zenoh_backend_redis"
crate-type = ["cdylib", "rlib"]

[features]
default = ["dynamic_plugin"]
dynamic_plugin = []
stats = ["zenoh/stats"]

[dependencies]
async-trait = "0.1"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "script"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
tracing = "0.1"
zenoh = { version = "=1.10.2", features = ["unstable", "internal", "plugins"] }
zenoh_backend_traits = { version = "=1.10.2", default-features = true }
zenoh-plugin-trait = "=1.10.2"
zenoh-util = "=1.10.2"

[build-dependencies]
rustc_version = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
